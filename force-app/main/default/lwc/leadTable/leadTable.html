<template>

    <lightning-card title="Lead Manager" icon-name="standard:lead">
        <template if:true={isSaving}>
            <lightning-spinner
                alternative-text="Saving..."
                size="medium">
            </lightning-spinner>
        </template>
        <div class="datatable-container">

            <lightning-datatable
                key-field="Id"
                data={leads}
                columns={columns}
                draft-values={draftValues}
                onsave={handleSave}
                hide-checkbox-column>
            </lightning-datatable>

        </div>

    </lightning-card>

</template>
