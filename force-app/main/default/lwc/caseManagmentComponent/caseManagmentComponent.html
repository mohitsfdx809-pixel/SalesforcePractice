<template>
    <lightning-card icon-name="standard:case" variant="base" title="Case Utility Management">
        <div>
           
            <lightning-record-picker
                label="Accounts"
                placeholder="Search Accounts..."
                object-api-name="Account"
                onchange={handleAccountChange}
            ></lightning-record-picker >
            <lightning-button label="Close Selected Cases" onclick={closeSelectedCases} variant="brand" icon-name="utility:close" disabled={disabledButton}></lightning-button>
        </div>
        <div>
           <h2>Summary Section</h2>
            <h4>Total Open Cases: {totalOpenCasesCount}</h4>
            <h4>Total Selected Cases: {totalSelectedCasesCount}</h4>
        </div>
        <div>
            <lightning-spinner if:true={isLoading} size="medium" variant="brand"></lightning-spinner>
            <template if:true={isDataLoaded}>
                <lightning-datatable
                    key-field="Id"
                    data={cases}
                    columns={caseColumns}
                    onrowselection={handleRowSelection}
                ></lightning-datatable>

            </template>
            <template if:false={isDataLoaded}>
                <p>No Data Available.</p>
            </template>
        </div>
    </lightning-card>
</template>
